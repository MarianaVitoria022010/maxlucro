<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxLucro - Verificar Código</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="saiba-mais-container">
        <header class="header-saiba-mais">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="Logo MaxLucro">
            </div>
            <a href="{{ url_for('index') }}" class="btn-back">Voltar para o Login</a>
        </header>

        <section class="form-section">
            <div class="form-container">
                <h2>Verificar Código</h2>
                <p>Enviamos um código de verificação para o seu e-mail. Digite os números abaixo para continuar.</p>
                
                <form action="{{ url_for('verificar_codigo') }}" method="POST">
                    <div class="input-group">
                        <label for="codigo">Código de Verificação</label>
                        <input type="text" id="codigo" name="codigo" placeholder="Digite o código" required autocomplete="off" style="text-align: center; font-size: 20px; letter-spacing: 4px;">
                    </div>
                    
                    <button type="submit" class="btn-enviar">Verificar Código</button>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
